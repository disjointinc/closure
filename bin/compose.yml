services:
  closure-db:
    image: postgres:18
    ports:
      - "${CLOSURE_POSTGRES_PORT:-54326}:5432"
    environment:
      POSTGRES_DB: closure_local
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    volumes:
      - closure-pgdata:/var/lib/postgresql
      # Postgres runs these Drizzle-generated SQL migrations on first boot
      # only (empty data dir). Regenerate with `npm run db:generate -w api`.
      - ../api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d closure_local"]
      interval: 5s
      timeout: 5s
      retries: 5
  closure-redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "password"]
    ports:
      - "${CLOSURE_REDIS_PORT:-63796}:6379"
  closure-api:
    image: node:24-alpine
    working_dir: /closure
    volumes:
      - ..:/closure:ro
    command: node api/server.ts
    ports:
      - "${CLOSURE_API_PORT:-3226}:3226"
    environment:
      CLOSURE_POSTGRES_HOST: closure-db
      CLOSURE_POSTGRES_PORT: "5432"
      CLOSURE_REDIS_HOST: closure-redis
      CLOSURE_REDIS_PORT: "6379"
    depends_on:
      closure-db:
        condition: service_healthy
      closure-redis:
        condition: service_started
  closure-web:
    image: node:24-alpine
    working_dir: /closure
    volumes:
      # Read-write: the TanStack Router vite plugin writes its generated
      # route tree (web/routeTree.gen.ts) during dev.
      - ..:/closure
      # Keeps container-installed Linux binaries out of the host's
      # node_modules.
      - closure-web-node-modules:/closure/node_modules
    # --ignore-scripts: skips the repo's "prepare" hook (lefthook), which
    # has no .git to install into here.
    command: sh -c "npm ci --ignore-scripts && exec npm run dev -w web"
    ports:
      - "${CLOSURE_WEB_PORT:-3216}:3216"

volumes:
  closure-pgdata:
  closure-web-node-modules:

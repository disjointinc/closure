services:
  rts-db:
    image: postgres:18
    ports:
      - "${RTS_POSTGRES_PORT:-54326}:5432"
    environment:
      POSTGRES_DB: rts_local
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    volumes:
      - rts-pgdata:/var/lib/postgresql
  rts-redis:
    image: redis:8-alpine
    ports:
      - "${RTS_REDIS_PORT:-63796}:6379"

volumes:
  rts-pgdata:

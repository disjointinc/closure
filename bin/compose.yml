# Every port below is published on 127.0.0.1 only, so it's reachable from
# this machine but not the network. The one way in from outside is
# closure-gateway's HTTPS ports (CLOSURE_GATEWAY_HTTP_PORT and
# CLOSURE_GATEWAY_HTTPS_PORT), once bin/Caddyfile's site addresses are set to
# domain names.
services:
  closure-db:
    image: postgres:18
    ports:
      - "127.0.0.1:${CLOSURE_POSTGRES_PORT:-54326}:5432"
    environment:
      POSTGRES_DB: closure_local
      # Only applied when the volume is first created: changing it later
      # won't change an existing database's password.
      POSTGRES_PASSWORD: "${CLOSURE_POSTGRES_PASSWORD:?run node bin/generate-env.ts}"
      POSTGRES_USER: postgres
    volumes:
      - closure-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d closure_local"]
      interval: 5s
      timeout: 5s
      retries: 5
  closure-redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${CLOSURE_REDIS_PASSWORD:?run node bin/generate-env.ts}",
      ]
    ports:
      - "127.0.0.1:${CLOSURE_REDIS_PORT:-63796}:6379"
  # One-shot: creates the databases Hatchet and Nango keep their own state in,
  # on closure-db, then exits. Idempotent, so it's safe on every `up`.
  closure-create-databases:
    image: postgres:18
    command:
      - sh
      - -c
      - |
        for db in hatchet nango; do
          psql -tAc "select 1 from pg_database where datname = '$$db'" | grep -q 1 || psql -c "create database $$db"
        done
    restart: "no"
    environment:
      PGHOST: closure-db
      PGUSER: postgres
      PGPASSWORD: "${CLOSURE_POSTGRES_PASSWORD:?run node bin/generate-env.ts}"
    depends_on:
      closure-db:
        condition: service_healthy
  # Hatchet: the durable queue task notifications are delivered through,
  # with per-integration rate limits and retries. See
  # api/cache/task-notification/worker.ts.
  closure-hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.110.5
    ports:
      - "127.0.0.1:${CLOSURE_HATCHET_PORT:-3246}:8888"
      - "127.0.0.1:${CLOSURE_HATCHET_GRPC_PORT:-3247}:7070"
    environment:
      # Refer to https://docs.hatchet.run/self-hosting/configuration-options
      # hatchet-migrate only reads a URL, so CLOSURE_POSTGRES_PASSWORD must
      # be URL-safe (letters, digits, - . _ ~).
      DATABASE_URL: "postgresql://postgres:${CLOSURE_POSTGRES_PASSWORD:?run node bin/generate-env.ts}@closure-db:5432/hatchet?sslmode=disable"
      # The dashboard login for admin@example.com, set when Hatchet first
      # starts (changing it later has no effect).
      ADMIN_PASSWORD: "${CLOSURE_HATCHET_DASHBOARD_PASSWORD:?run node bin/generate-env.ts}"
      # Hatchet won't start without a cookie domain (there's no default).
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "true"
      # Browsers share cookies across localhost ports, so the default name
      # ("hatchet") would clash with any other Hatchet dashboard on localhost.
      SERVER_AUTH_COOKIE_NAME: closure-hatchet
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "true"
      SERVER_URL: "http://localhost:${CLOSURE_HATCHET_PORT:-3246}"
    volumes:
      # A bind mount, so closure-hatchet-token can sign a client token with
      # the config Hatchet generates here.
      - ./.hatchet:/config
    depends_on:
      closure-create-databases:
        condition: service_completed_successfully
  # One-shot: mints the client token the API's Hatchet worker authenticates
  # with into bin/.env as CLOSURE_HATCHET_CLIENT_TOKEN (read by config.ts),
  # once: if bin/.env already has one, it does nothing. Waits for
  # closure-hatchet to generate the config the token is signed with. If you
  # ever reset Hatchet by wiping bin/.hatchet, delete that line from bin/.env
  # too, so the next `up` mints a token for the new config.
  closure-hatchet-token:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.110.5
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /closure-bin/.env ]; then
          echo "bin/.env is missing: run node bin/generate-env.ts first" >&2
          exit 1
        fi
        if grep -q '^CLOSURE_HATCHET_CLIENT_TOKEN=' /closure-bin/.env; then
          exit 0
        fi
        for attempt in $$(seq 1 60); do
          test -s /config/server.yaml && break
          sleep 2
        done
        # Hatchet tokens expire after 90 days by default, which would cut
        # the worker off from Hatchet on a long-running server. This one is
        # only used inside the private Docker network, so it gets 100 years.
        token="$$(./hatchet-admin token create --config /config --name closure --expiresIn 876000h)"
        printf 'CLOSURE_HATCHET_CLIENT_TOKEN=%s\n' "$$token" >> /closure-bin/.env
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://postgres:${CLOSURE_POSTGRES_PASSWORD:?run node bin/generate-env.ts}@closure-db:5432/hatchet?sslmode=disable"
      # token create loads the server config, which needs this too.
      SERVER_AUTH_COOKIE_DOMAIN: localhost
    volumes:
      - ./.hatchet:/config
      # The repo's bin/ folder (where bin/.env lives). Not mounted at /bin,
      # which holds the container's own programs (sh, grep).
      - .:/closure-bin
    depends_on:
      closure-hatchet:
        condition: service_started
  # Nango: stores integration credentials (OAuth tokens, API keys), runs the
  # OAuth flows (its Connect UI), and proxies the API calls task
  # notifications make to Slack, Teams, Linear, and Jira.
  closure-nango:
    image: nangohq/nango-server:hosted-0.71.13
    # Nango only publishes amd64 images. x64 hosts (including Windows) run
    # it natively; ARM hosts emulate it (see README for ARM Linux).
    platform: linux/amd64
    ports:
      # 8080: the port the nango-server image itself sets (PORT).
      - "127.0.0.1:${CLOSURE_NANGO_PORT:-3256}:8080"
      - "127.0.0.1:${CLOSURE_NANGO_CONNECT_PORT:-3257}:3009"
    environment:
      # Nango's database name defaults to "nango" (made by
      # closure-create-databases).
      NANGO_DB_HOST: closure-db
      NANGO_DB_USER: postgres
      NANGO_DB_PASSWORD: "${CLOSURE_POSTGRES_PASSWORD:?run node bin/generate-env.ts}"
      # Logical db 1, so Nango's keys never mix with Closure's (db 0). Only a
      # URL can pick the db, so CLOSURE_REDIS_PASSWORD must be URL-safe
      # (letters, digits, - . _ ~).
      NANGO_REDIS_URL: "redis://:${CLOSURE_REDIS_PASSWORD:?run node bin/generate-env.ts}@closure-redis:6379/1"
      # Encrypts the credentials Nango stores. Never change it once set, or
      # stored credentials become unreadable.
      NANGO_ENCRYPTION_KEY: "${CLOSURE_NANGO_ENCRYPTION_KEY:?run node bin/generate-env.ts}"
      # The API key Closure calls Nango with (must match config.ts).
      NANGO_SECRET_KEY_PROD: "${CLOSURE_NANGO_SECRET_KEY:?run node bin/generate-env.ts}"
      NANGO_DASHBOARD_USERNAME: "${CLOSURE_NANGO_DASHBOARD_USERNAME:-admin}"
      NANGO_DASHBOARD_PASSWORD: "${CLOSURE_NANGO_DASHBOARD_PASSWORD:?run node bin/generate-env.ts}"
      NANGO_SERVER_URL: "http://localhost:${CLOSURE_NANGO_PORT:-3256}"
      NANGO_PUBLIC_CONNECT_URL: "http://localhost:${CLOSURE_NANGO_CONNECT_PORT:-3257}"
      # Nango's entrypoint only serves the Connect UI when this is "true".
      FLAG_SERVE_CONNECT_UI: "true"
    depends_on:
      closure-create-databases:
        condition: service_completed_successfully
      closure-redis:
        condition: service_started
  # One-shot: applies Drizzle migrations (api/db/migrations) on every `up`,
  # then exits. closure-api waits for it, so the schema is always in place
  # before traffic. Regenerate migrations with `npm run db:generate -w api`;
  # apply to a local db from the host with `npm run db:migrate -w api`.
  closure-migrate:
    image: node:24-alpine
    working_dir: /closure
    volumes:
      # Read-write, like closure-web: npm install needs to manage node_modules.
      - ..:/closure
      # Container-local node_modules: a fresh (curl-installed) checkout has
      # none, and the host's may hold binaries for the wrong platform.
      - closure-migrate-node-modules:/closure/node_modules
    # npm install (not ci): reconciles the root node_modules only, so web's
    # node_modules (its live Vite cache) is never touched. --ignore-scripts:
    # skips the repo's "prepare" hook (lefthook), which has no .git here.
    command: sh -c "npm install --ignore-scripts && exec node api/db/migrate.ts"
    restart: "no"
    environment:
      CLOSURE_POSTGRES_HOST: closure-db
      CLOSURE_POSTGRES_PORT: "5432"
      CLOSURE_POSTGRES_PASSWORD: "${CLOSURE_POSTGRES_PASSWORD:?run node bin/generate-env.ts}"
    depends_on:
      closure-db:
        condition: service_healthy
  closure-api:
    image: node:24-alpine
    working_dir: /closure
    volumes:
      # Read-write, like closure-web: npm install needs to manage node_modules.
      - ..:/closure
      # Container-local node_modules (see closure-migrate above). Separate
      # volume from closure-migrate: an install there must never pull
      # node_modules out from under this long-running service.
      - closure-api-node-modules:/closure/node_modules
    # npm install / --ignore-scripts: see closure-migrate. --watch: restart
    # the server when the mounted source changes (dev).
    command: sh -c "npm install --ignore-scripts && exec node --watch api/server.ts"
    ports:
      - "127.0.0.1:${CLOSURE_API_PORT:-3216}:3216"
    environment:
      CLOSURE_API_PORT: "3216"
      # Every API route except /healthz requires it (from
      # bin/generate-env.ts). The API won't start without it.
      CLOSURE_API_KEY: "${CLOSURE_API_KEY:?run node bin/generate-env.ts}"
      CLOSURE_POSTGRES_HOST: closure-db
      CLOSURE_POSTGRES_PORT: "5432"
      CLOSURE_POSTGRES_PASSWORD: "${CLOSURE_POSTGRES_PASSWORD:?run node bin/generate-env.ts}"
      CLOSURE_REDIS_HOST: closure-redis
      CLOSURE_REDIS_PORT: "6379"
      CLOSURE_REDIS_PASSWORD: "${CLOSURE_REDIS_PASSWORD:?run node bin/generate-env.ts}"
      CLOSURE_HATCHET_HOST: closure-hatchet
      CLOSURE_HATCHET_PORT: "8888"
      CLOSURE_HATCHET_GRPC_PORT: "7070"
      CLOSURE_NANGO_HOST: closure-nango
      CLOSURE_NANGO_PORT: "8080"
      CLOSURE_NANGO_SECRET_KEY: "${CLOSURE_NANGO_SECRET_KEY:?run node bin/generate-env.ts}"
      # Encrypts webhook secrets (from bin/generate-env.ts). The API won't start
      # without it.
      CLOSURE_SECRETS_KEY: "${CLOSURE_SECRETS_KEY:?run node bin/generate-env.ts}"
      CLOSURE_OUTBOUND_ALLOW_PRIVATE_NETWORKS: "${CLOSURE_OUTBOUND_ALLOW_PRIVATE_NETWORKS:-false}"
    # The docs container syncs this service's /openapi.json to a local file
    # before mint boots, so the API must be serving first. Generous retries:
    # first-boot `npm install` precedes the server.
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and the server
      # binds IPv4 only.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$${CLOSURE_API_PORT}/healthz || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      closure-db:
        condition: service_healthy
      closure-redis:
        condition: service_started
      closure-migrate:
        condition: service_completed_successfully
      closure-hatchet-token:
        condition: service_completed_successfully
      closure-nango:
        condition: service_started
  closure-web:
    image: node:24-alpine
    working_dir: /closure
    volumes:
      # Read-write: the TanStack Router vite plugin writes its generated
      # route tree (web/routeTree.gen.ts) during dev.
      - ..:/closure
      # Keeps container-installed Linux binaries out of the host's
      # node_modules.
      - closure-web-node-modules:/closure/node_modules
    # --ignore-scripts: skips the repo's "prepare" hook (lefthook), which
    # has no .git to install into here.
    command: sh -c "npm install --ignore-scripts && exec npm run dev -w web"
    # No published port: browsers reach it through closure-gateway, which
    # asks for CLOSURE_API_KEY first.
    environment:
      CLOSURE_WEB_PORT: "3226"
      # Browser-side URLs of the API and docs; the dev server passes VITE_*
      # through to the bundle (web/src/lib/api.ts). closure-gateway serves
      # the API at /api on the web portal's own origin and adds
      # CLOSURE_API_KEY to each call. Both follow CLOSURE_PUBLIC_WEB_URL and
      # CLOSURE_PUBLIC_DOCS_URL when set (see closure-gateway), and localhost
      # otherwise.
      VITE_CLOSURE_API_URL: ${CLOSURE_PUBLIC_WEB_URL:-http://localhost:${CLOSURE_WEB_PORT:-3226}}/api
      VITE_CLOSURE_DOCS_URL: ${CLOSURE_PUBLIC_DOCS_URL:-http://localhost:${CLOSURE_DOCS_PORT:-3236}}
  closure-docs:
    image: node:24-alpine
    working_dir: /closure
    volumes:
      - ..:/closure
      # Container-local node_modules (see closure-migrate above).
      - closure-docs-node-modules:/closure/node_modules
    # npm install / --ignore-scripts: see closure-migrate. The background
    # poller keeps docs/openapi.json in sync so mint rebuilds the API
    # reference on change (local dev only; start syncs once at boot).
    command: sh -c "npm install --ignore-scripts && (npm run poll -w docs &) && exec npm run start -w docs"
    environment:
      # A container has no TTY for mint's TUI; CI mode logs plainly instead.
      CI: "true"
      CLOSURE_API_URL: http://closure-api:3216/openapi.json
      CLOSURE_DOCS_PORT: "3236"
      # sync-openapi.ts sends it to fetch /openapi.json.
      CLOSURE_API_KEY: "${CLOSURE_API_KEY:?run node bin/generate-env.ts}"
    # No published port: browsers reach it through closure-gateway (see
    # closure-web).
    depends_on:
      closure-api:
        condition: service_healthy
  # Puts a login in front of the web portal and docs (username admin,
  # password CLOSURE_API_KEY). See bin/Caddyfile.
  closure-gateway:
    image: caddy:2.11.7-alpine
    # basic_auth only takes a bcrypt hash, so hash CLOSURE_API_KEY at start
    # rather than storing a second secret in bin/.env.
    command:
      - sh
      - -c
      - |
        set -e
        CLOSURE_API_KEY_HASH="$$(caddy hash-password --plaintext "$$CLOSURE_API_KEY")"
        export CLOSURE_API_KEY_HASH
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "127.0.0.1:${CLOSURE_WEB_PORT:-3226}:3226"
      - "127.0.0.1:${CLOSURE_DOCS_PORT:-3236}:3236"
      # HTTPS (443) and the http port Caddy uses to prove it owns a domain
      # and to redirect to HTTPS (80). Open to the network on purpose. A
      # deploy with a domain sets these to 80 and 443; local dev keeps the
      # defaults, which nothing listens on.
      - "${CLOSURE_GATEWAY_HTTP_PORT:-3266}:80"
      - "${CLOSURE_GATEWAY_HTTPS_PORT:-3267}:443"
    environment:
      CLOSURE_API_KEY: "${CLOSURE_API_KEY:?run node bin/generate-env.ts}"
      # Public URLs to serve over HTTPS (see bin/Caddyfile). The defaults
      # are bare ports: plain http on localhost. Caddy can't fall back on
      # its own if a variable is set but empty, so the defaults live here.
      CLOSURE_PUBLIC_API_URL: "${CLOSURE_PUBLIC_API_URL:-:3216}"
      CLOSURE_PUBLIC_WEB_URL: "${CLOSURE_PUBLIC_WEB_URL:-:3226}"
      CLOSURE_PUBLIC_DOCS_URL: "${CLOSURE_PUBLIC_DOCS_URL:-:3236}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # HTTPS certificates. Kept across restarts so Caddy doesn't request
      # new ones each time (certificate authorities rate-limit that).
      - closure-gateway-data:/data
    depends_on:
      closure-api:
        condition: service_started
      closure-web:
        condition: service_started
      closure-docs:
        condition: service_started

volumes:
  closure-pgdata:
  closure-migrate-node-modules:
  closure-api-node-modules:
  closure-web-node-modules:
  closure-docs-node-modules:
  closure-gateway-data:
